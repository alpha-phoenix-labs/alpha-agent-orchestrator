name: phase3-current-main-render-validation

on:
  push:
    branches:
      - phase3/current-main-runtime-refresh

permissions:
  contents: read

jobs:
  real-read:
    runs-on: ubuntu-latest
    steps:
      - name: Validate current-main Render constrained proxy
        env:
          ALPHA_RENDER_PROXY_TOKEN: ${{ secrets.ALPHA_RENDER_PROXY_TOKEN }}
          PROXY_URL: https://alpha-agent-orchestrator-render-read.onrender.com/v1/render/services
        run: |
          set -euo pipefail
          if [ -z "${ALPHA_RENDER_PROXY_TOKEN:-}" ]; then
            echo 'RENDER_PROXY_TOKEN_NOT_AVAILABLE_IN_ACTIONS'
            exit 2
          fi
          output="$(curl --fail-with-body -sS -H "Authorization: Bearer ${ALPHA_RENDER_PROXY_TOKEN}" "${PROXY_URL}")"
          printf '%s\n' "$output"
          OUTPUT="$output" python - <<'PY'
          import json, os
          payload = json.loads(os.environ['OUTPUT'])
          assert payload['source'] == 'render'
          assert payload['status'] == 200
          assert payload['freshness_result'] == 'FRESH'
          assert payload['verification_state'] == 'READ_VALIDATED'
          assert payload['write_capability_exposed'] is False
          assert isinstance(payload['service_count'], int)
          assert payload['collector_id'] == 'alpha_orchestrator.read_plane.ReadBroker'
          assert payload['transport_id'].endswith('.RenderReadTransport')
          assert payload['target_id'].startswith('render:api.render.com/v1/services')
          assert payload['observed_url'].startswith('https://api.render.com/v1/services?')
          print('PHASE3_RENDER_CURRENT_MAIN_REAL_READ: PASS')
          PY
