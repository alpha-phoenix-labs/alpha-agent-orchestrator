name: control-plane-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Security and mock-flow tests
        env:
          ALPHA_SYSTEM_MODE: OFFLINE
          ALPHA_WRITES_ENABLED: 'false'
        run: python -m pytest
