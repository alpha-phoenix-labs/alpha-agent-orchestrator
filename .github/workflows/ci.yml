name: control-plane-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Security and mock-flow tests
        env:
          ALPHA_SYSTEM_MODE: OFFLINE
          ALPHA_WRITES_ENABLED: 'false'
        run: python -m pytest
      - name: Phase 2 mock demo - no execution
        env:
          ALPHA_SYSTEM_MODE: OFFLINE
          ALPHA_WRITES_ENABLED: 'false'
        run: |
          output="$(python scripts/mock_demo.py)"
          printf '%s\n' "$output"
          grep -Fq 'MODE: MOCK' <<< "$output"
          grep -Fq 'NO REAL INTEGRATIONS: true' <<< "$output"
          grep -Fq 'RESULT: WAITING_FOR_APPROVAL' <<< "$output"
          grep -Fq 'No write was executed.' <<< "$output"
