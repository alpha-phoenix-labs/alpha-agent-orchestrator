name: operations-preview-external-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-preview-external-smoke
  cancel-in-progress: false

jobs:
  external-preview-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ALPHA_OPERATIONS_PREVIEW_URL: https://alpha-agent-orchestrator-operations.onrender.com
      ALPHA_OPERATIONS_PREVIEW_TOKEN: ${{ secrets.ALPHA_OPERATIONS_PREVIEW_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository package
        run: python -m pip install -e .

      - name: Fail closed when preview credential is unavailable
        shell: bash
        run: |
          if [ -z "$ALPHA_OPERATIONS_PREVIEW_TOKEN" ]; then
            echo 'Required GitHub Actions secret ALPHA_OPERATIONS_PREVIEW_TOKEN is unavailable.' >&2
            exit 1
          fi

      - name: Verify external read-only Operations preview
        run: python -m alpha_orchestrator.operations_preview_smoke
