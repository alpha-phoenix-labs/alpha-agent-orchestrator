name: phase3-real-read-validation

on:
  push:
    branches:
      - phase3/real-read-validation

permissions:
  contents: read

jobs:
  real-read:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Phase 3 authenticated GitHub GET smoke
        env:
          ALPHA_GITHUB_READ_TOKEN: ${{ github.token }}
          ALPHA_SYSTEM_MODE: READ_ONLY
          ALPHA_WRITES_ENABLED: 'false'
        run: |
          output="$(python scripts/phase3_github_real_read.py)"
          printf '%s\n' "$output"
          grep -Fq 'PHASE3_REAL_READ: PASS' <<< "$output"
          grep -Fq 'SOURCE: github' <<< "$output"
          grep -Fq 'STATUS: 200' <<< "$output"
          grep -Fq 'WRITE_CAPABILITY_EXPOSED: false' <<< "$output"
