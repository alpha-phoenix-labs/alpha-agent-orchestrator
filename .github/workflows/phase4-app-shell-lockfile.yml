name: phase4-app-shell-lockfile

on:
  push:
    branches: [phase4/app-shell]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'LOCKFILE_UNCHANGED'
          else
            git commit -m 'Pin Phase 4.4 frontend dependency graph'
            git push origin HEAD:phase4/app-shell
          fi
