version: 1
mode: READ_ONLY
writes_enabled: false
sources:
  github:
    transport: https_get_only
    host_allowlist:
      - api.github.com
    path_prefix_allowlist:
      - /repos/
    credential_visibility: backend_only
  render:
    transport: https_get_only
    host_allowlist:
      - api.render.com
    path_prefix_allowlist:
      - /v1/services
      - /v1/deploys
      - /v1/postgres
    credential_visibility: backend_only
security:
  agents_receive_credentials: false
  agents_can_select_http_method: false
  fail_closed_on_unknown_source: true
  fail_closed_on_non_json: true
  fail_closed_on_non_2xx: true
