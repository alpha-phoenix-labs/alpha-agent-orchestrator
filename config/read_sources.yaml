version: 2
mode: READ_ONLY
writes_enabled: false
sources:
  github:
    transport: backend_https_get_only
    host_allowlist:
      - api.github.com
    repository_allowlist:
      - alpha-phoenix-labs/alpha-agent-orchestrator
    path_prefix_allowlist:
      - /repos/alpha-phoenix-labs/alpha-agent-orchestrator
    credential_visibility: backend_transport_only
  render:
    transport: backend_https_get_only
    host_allowlist:
      - api.render.com
    path_prefix_allowlist:
      - /v1/services
      - /v1/postgres
    path_template_allowlist:
      - /v1/services
      - /v1/services/{serviceId}
      - /v1/services/{serviceId}/deploys
      - /v1/services/{serviceId}/deploys/{deployId}
      - /v1/postgres
    forbidden_sensitive_descendants:
      - /env-vars
      - /secret-files
      - /credentials
      - /export
    credential_visibility: backend_transport_only
security:
  agents_receive_credentials: false
  callers_can_supply_credentials: false
  agents_can_select_http_method: false
  fail_closed_on_unknown_source: true
  fail_closed_on_non_json: true
  fail_closed_on_non_2xx: true
